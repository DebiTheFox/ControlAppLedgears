changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🎨 UI & Design"
      labels:
        - ui
        - layout
    - title: "🛠 Other Changes"
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
    authors:
      - octocat
