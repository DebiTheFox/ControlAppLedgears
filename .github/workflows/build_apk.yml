name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Control_LED_Gears.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Control_LED_Gears
          path: app/build/outputs/apk/debug/Control_LED_Gears.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          artifacts: "app/build/outputs/apk/debug/Control_LED_Gears.apk"
          tag: "v${{ github.run_number }}"
          name: "Release v${{ github.run_number }}"
          generateReleaseNotes: true
          makeLatest: true
          bodyFile: "RELEASE_NOTES.md"
          token: ${{ secrets.GITHUB_TOKEN }}
